</style><rect width="760" height="176" style="fill:var(--bg)"/><text x="16" y="24" class="h">Holding everything through a real review station (F01)</text><text x="16" y="166" class="t2">SIMULATED - one review station, 45 s per held part (illustrative).</text><line class="base" x1="250" x2="250" y1="50" y2="116"/><text class="t2" x="470" y="146" text-anchor="middle">good assemblies / hour</text><text class="t1" x="240" y="75" text-anchor="end">rules + FIFO</text><rect class="s1" x="250" y="62" width="419.0" height="16" rx="4"><title>rules + FIFO: 201.5</title></rect><text class="t1" x="675.0" y="75">201.5</text><text class="t1" x="240" y="105" text-anchor="end">hold everything (Gate-A B7)</text><rect class="s1" x="250" y="92" width="75.2" height="16" rx="4"><title>hold everything (Gate-A B7): 36.2</title></rect><text class="t1" x="331.2" y="105">36.2</text></svg>