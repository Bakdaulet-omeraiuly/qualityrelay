# REL-02 quality gates. Each job is a separate required status check on `main`
# (see docs/engineering/CI_AND_REVIEW_POLICY.md). CI installs requirements-lock.txt: exact transitive
# pins of requirements-demo.txt + requirements-dev.txt (REL-03, scripts/check_dependencies.py lock).
name: QualityRelay CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 'requirements-*.txt'}
      - run: pip install -r requirements-lock.txt
      - name: ruff (pyflakes + syntax errors; config in pyproject.toml)
        run: ruff check --output-format=github .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 'requirements-*.txt'}
      - run: pip install -r requirements-lock.txt
      - name: mypy (safety/auth/actuation modules must be clean; research ratchet in pyproject.toml)
        run: mypy qualityrelay17

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 'requirements-*.txt'}
      - run: pip install -r requirements-lock.txt
      - name: JSON Schemas valid + OpenAPI snapshot matches the API
        run: python scripts/check_schemas.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 'requirements-*.txt'}
      - run: pip install -r requirements-lock.txt
      - name: bandit (blocks on medium/high severity)
        run: bandit -r qualityrelay17 scripts -ll
      - name: pip-audit (known CVEs in the exact locked environment)
        run: pip-audit --progress-spinner off
      - name: no secrets or keys tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)(keys|secrets)/|\.(pem|key)$' || true)
          if [ -n "$bad" ]; then echo "::error::secret-like files are tracked:"; echo "$bad"; exit 1; fi

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 'requirements-*.txt'}
      - run: pip install -r requirements-lock.txt
      - name: manifest <-> requirements <-> lock, and adapter-status evidence
        run: python scripts/check_dependencies.py check
      - name: installed env == lock; every licence known, allowed and unchanged since review
        run: python scripts/check_dependencies.py env --report licenses.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: installed-licenses, path: licenses.json}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}', cache: pip, cache-dependency-path: 'requirements-*.txt'}
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m qualityrelay17.demo > /tmp/qualityrelay-demo.json
      - run: python -c "import json; assert json.load(open('/tmp/qualityrelay-demo.json'))['source_status']=='SYNTHETIC_DEMO_NOT_REAL_FACTORY_RESULT'"
